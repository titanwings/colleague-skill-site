name: Website quality gates

# Build → internal link check → axe-core accessibility gate → evidence capture.
# Runs on any PR that touches the site, plus pushes to main.
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, links and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # The scripts prefer the system Chrome and fall back to Playwright's
      # bundled Chromium, so install the bundled one on CI.
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Check internal links and assets
        working-directory: website
        run: npm run check:links

      - name: Accessibility gate (axe-core, WCAG 2.2 A/AA)
        working-directory: website
        run: npm run check:a11y

      - name: Capture evidence screenshots
        working-directory: website
        run: node scripts/capture.mjs --label ci

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-evidence
          path: |
            docs/evidence/images
            docs/evidence/captures
            docs/evidence/a11y-report.json
            docs/evidence/link-report.json
          retention-days: 14
